name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-signed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Scaffold android platform (package app.orubus.mangaca)
        run: flutter create . --project-name mangaca --org app.orubus --platforms android

      - name: Pin Kotlin compiler to 2.2.20 (plugin ecosystem — flutter_tts ships stdlib 2.2 metadata)
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/settings.gradle')
          s = p.read_text()
          s2 = re.sub(r'id "org\.jetbrains\.kotlin\.android" version "[^"]+"',
                      'id "org.jetbrains.kotlin.android" version "2.2.20"', s)
          assert s2 != s, 'kotlin plugin line not found in settings.gradle'
          p.write_text(s2)
          print('\n'.join(l for l in s2.splitlines() if 'kotlin' in l))
          PY

      - name: Apply android overlay (applicationId, signing, manifest, icons, updater)
        run: |
          cp -rv android-overlay/app/. android/app/
          echo "--- applied ---"
          ls -la android/app/src/main/kotlin/app/orubus/mangaca

      - name: Restore signing keystore + key.properties (secrets only, never committed)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > android/app/mangaca-release.jks
          cat > android/key.properties <<EOF
          storeFile=mangaca-release.jks
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KS_PASS
          EOF
          ls -la android/app/mangaca-release.jks

      - name: Pub get
        run: flutter pub get

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Collect APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk mangaca.apk
          ls -la mangaca.apk
          sha256sum mangaca.apk | tee mangaca.apk.sha256

      - name: Generate delta patch + release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          python3 -m pip install --quiet bsdiff4
          python3 scripts/make_manifest.py
          cat release/updates.json

      - name: Commit release/updates.json (the updater's manifest)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/updates.json
          if git diff --cached --quiet; then
            echo "manifest unchanged"
          else
            git commit -m "release manifest ${{ github.ref_name }} [skip ci]"
            git push origin HEAD:main || echo "manifest push skipped (non-blocking)"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            mangaca.apk
            mangaca.apk.sha256
            mangaca-delta.bsdiff
          body: |
            MANGACA ${{ github.ref_name }} — Read Beyond The Illusion.

            v0.0.3 "SOURCERY":

            - Comics fixed end-to-end: every MangaDex lane now auto-relays through
              the runtime proxy if the device path fails, and the comics grid
              falls back to AniList discovery — rows never dead-end again.
            - NEW origin rails (all English-translated): Japanese Manga — Current,
              Korean Manhwa — Current, Chinese Manhua — Current (AniList-backed).
            - Novels & classics covers: SmartCover tries the image proxy, then the
              direct CDN, then a clean letter tile — no more placeholder bubbles.
            - Read-aloud TTS rebuilt on an epoch state machine: pause/resume/jump/
              speed changes can no longer skip or repeat sentences (stale engine
              events are dropped); error streaks pause cleanly instead of looping.
            - Touch lock rebuilt: explicit padlock in the top bar, a lock badge that
              stays visible while locked, and a thumb-friendly unlock pill. All
              content touches are frozen; read-aloud keeps playing.
            - TTS transport now stays on screen with chrome hidden.
            - Delta self-updater unchanged (Settings › APP UPDATES) — this build
              ships the first real delta: 0.0.2 → 0.0.3 as a bsdiff patch.
            - Package app.orubus.mangaca · signed release · genjutsu identity via @orubus_bot
          generate_release_notes: false
